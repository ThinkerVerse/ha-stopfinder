name: Release after merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-on-merge
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Calculate next version
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const labels = new Set(
            (process.env.LABELS || '')
              .split(',')
              .map((label) => label.trim().toLowerCase())
              .filter(Boolean),
          );

          const tags = execFileSync(
            'git',
            ['tag', '--list', 'v*', '--sort=-version:refname'],
            { encoding: 'utf8' },
          )
            .trim()
            .split(/\r?\n/)
            .filter(Boolean);

          const match = tags[0]?.match(/^v(\d+)\.(\d+)\.(\d+)$/);
          const current = match
            ? match.slice(1).map(Number)
            : [0, 0, 0];

          if (labels.has('breaking')) {
            current[0] += 1;
            current[1] = 0;
            current[2] = 0;
          } else if (labels.has('feature')) {
            current[1] += 1;
            current[2] = 0;
          } else {
            current[2] += 1;
          }

          const version = `v${current.join('.')}`;
          require('node:fs').appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${version}\n`,
          );
          NODE

      - name: Create annotated tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION" main
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target main --generate-notes --title "$VERSION"

      - name: Delete merged branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
